<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - LINVIA</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-shell">
    <div class="screen">
      <div class="top-nav">
        <button class="nav-item" onclick="history.back()"><i class="fas fa-chevron-left"></i></button>
        <div class="nav-logo">LINVIA<span style="color:var(--primary-green)">®</span></div>
        <button class="nav-item"><i class="fas fa-ellipsis-v"></i></button>
      </div>
      <div class="screen-content auth-page">
        <div class="auth-card">
          <div class="auth-logo">
            <img src="https://cdn-icons-png.flaticon.com/512/2111/2111652.png" alt="LINVIA">
            <span>LINVIA<span style="color:var(--primary-green)">®</span></span>
          </div>
          <h2 class="auth-title">Register</h2>
          <p class="auth-subtitle">If you need any support <a href="#" style="color:var(--primary-green)">Click Here</a></p>

          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-input" placeholder="Full name">
          </div>
          <div class="form-group">
            <label class="form-label">Enter Email</label>
            <input type="email" class="form-input" placeholder="you@example.com">
          </div>
          <div class="form-group input-with-icon">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" placeholder="Password">
            <i class="fas fa-eye"></i>
          </div>
          <button class="btn btn-primary mb-4">Create Account</button>
          <div class="auth-divider"><span>Or</span></div>
          <div class="social-login">
            <button class="social-btn"><i class="fab fa-google"></i> Google</button>
            <button class="social-btn"><i class="fab fa-apple"></i> Apple</button>
          </div>
          <div class="auth-footer">
            Do you have an account? <a href="signin.html">Sign In</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
