<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Now Playing - LINVIA</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-shell">
    <div class="screen now-playing-page">
      <div class="top-nav">
        <button class="nav-item" onclick="history.back()"><i class="fas fa-chevron-left"></i></button>
        <div class="nav-logo">Now playing</div>
        <button class="nav-item"><i class="fas fa-ellipsis-v"></i></button>
      </div>
      <div class="screen-content now-playing-main">
        <div class="now-playing-header">
          <button class="btn-icon" style="color:var(--dark-text-secondary);"><i class="fas fa-shuffle"></i></button>
          <button class="btn-icon" style="color:var(--dark-text-secondary);"><i class="fas fa-download"></i></button>
        </div>
        <div class="now-playing-art">
          <img src="https://images.unsplash.com/photo-1614614638761-e5d01e89504e?w=400&q=80" alt="Bad Guy">
        </div>
        <h2 class="now-playing-title">Bad Guy</h2>
        <p class="now-playing-artist">Billie Eilish</p>

        <div class="now-playing-progress-container">
          <div class="now-playing-time">
            <span>2:25</span>
            <span>4:02</span>
          </div>
          <div class="now-playing-progress">
            <div class="np-progress-fill" style="width:56%"></div>
          </div>
        </div>

        <div class="now-playing-controls">
          <button class="control-btn shuffle-btn"><i class="fas fa-shuffle"></i></button>
          <button class="control-btn"><i class="fas fa-step-backward"></i></button>
          <button class="control-btn play-pause"><i class="fas fa-pause"></i></button>
          <button class="control-btn"><i class="fas fa-step-forward"></i></button>
          <button class="control-btn repeat-btn"><i class="fas fa-redo"></i></button>
        </div>

        <button class="btn-outline" style="width:auto; padding:8px 20px; font-size:13px;">
          <i class="fas fa-arrow-up mr-2"></i> Lyrics
        </button>
      </div>
    </div>

    <div class="now-playing-bar" onclick="location.href='now-playing.html'">
      <div class="np-thumb">
        <img src="https://images.unsplash.com/photo-1614614638761-e5d01e89504e?w=100&q=80" alt="Now Playing">
      </div>
      <div class="np-info">
        <div class="np-title">Bad Guy</div>
        <div class="np-artist">Billie Eilish</div>
      </div>
      <div class="np-progress">
        <div class="np-progress-fill" style="width:56%"></div>
      </div>
      <div class="np-controls">
        <button class="btn-icon"><i class="fas fa-step-backward"></i></button>
        <button class="btn-icon play-pause"><i class="fas fa-pause"></i></button>
        <button class="btn-icon"><i class="fas fa-step-forward"></i></button>
      </div>
    </div>

    <div class="bottom-nav">
      <a href="home.html" class="nav-bottom-item"><i class="fas fa-home"></i><span>Home</span></a>
      <a href="search.html" class="nav-bottom-item"><i class="fas fa-search"></i><span>Search</span></a>
      <a href="library.html" class="nav-bottom-item active"><i class="fas fa-heart"></i><span>Library</span></a>
      <a href="profile.html" class="nav-bottom-item"><i class="fas fa-user"></i><span>Profile</span></a>
    </div>
  </div>
</body>
</html>
